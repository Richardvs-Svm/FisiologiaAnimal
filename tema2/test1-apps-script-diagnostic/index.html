<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>test1 · Apps Script diagnostic</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        display: grid;
        place-items: center;
        color: #102a43;
        background: #f4f7fa;
        font: 16px/1.5 system-ui, sans-serif;
      }
      main {
        width: min(680px, 100%);
        padding: 24px;
        background: white;
        border: 1px solid #d7e1ea;
        border-radius: 16px;
        box-shadow: 0 16px 45px rgba(16, 42, 67, 0.12);
      }
      h1 { margin: 0 0 6px; }
      p { margin-top: 0; color: #486581; }
      label { display: grid; gap: 6px; font-weight: 750; }
      input, button { min-height: 48px; padding: 10px 12px; font: inherit; border-radius: 8px; }
      input { width: 100%; color: #102a43; background: white; border: 1px solid #9fb3c3; }
      button {
        width: 100%;
        margin-top: 12px;
        cursor: pointer;
        color: white;
        background: #0b5c9e;
        border: 0;
        font-weight: 800;
      }
      input:focus-visible, button:focus-visible { outline: 3px solid #f4b942; outline-offset: 2px; }
      .error { margin: 10px 0 0; padding: 10px; color: #8f1d16; background: #fee4e2; border-radius: 8px; }
      details { margin-top: 20px; border-top: 1px solid #d7e1ea; }
      summary { padding-top: 16px; cursor: pointer; font-weight: 750; }
      pre {
        max-height: 280px;
        overflow: auto;
        padding: 12px;
        color: #d9e8f3;
        background: #102a43;
        border-radius: 8px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: 12px/1.5 ui-monospace, monospace;
      }
      .warning { margin-top: 14px; font-size: 13px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>test1</h1>
      <p>Enter anything. The Apps Script result will open in a new tab.</p>

      <form id="testForm" method="get" target="_blank" novalidate>
        <label for="nameInput">
          Name or test value
          <input id="nameInput" name="name" type="text" autocomplete="off" required />
        </label>
        <button type="submit">Submit to Apps Script</button>
        <p class="error" id="pageError" role="alert" hidden></p>
      </form>

      <p class="warning">
        Diagnostic test only: the entered value is sent in the URL and should not contain private information.
      </p>

      <details open>
        <summary>Page diagnostic log</summary>
        <pre id="diagnosticLog" aria-live="polite"></pre>
      </details>
    </main>

    <script src="script.js"></script>
  </body>
</html>
